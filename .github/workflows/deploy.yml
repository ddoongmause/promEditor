name: Deploy to Oracle A1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promeditor-production
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Test and build
        run: ./gradlew test bootJar

      - name: Prepare deployment files
        shell: bash
        run: |
          jar_file="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "${jar_file}"
          cp "${jar_file}" deploy/app.jar
          cp Dockerfile deploy/Dockerfile
          chmod 750 deploy/scripts/backup-db.sh

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server host key
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          release_dir="/tmp/promeditor-${GITHUB_SHA}"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "rm -rf '${release_dir}' && mkdir -p '${release_dir}'"
          scp -r deploy/. "${DEPLOY_USER}@${DEPLOY_HOST}:${release_dir}/"

      - name: Activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          release_dir="/tmp/promeditor-${GITHUB_SHA}"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s -- '${release_dir}'" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          release_dir="$1"
          app_dir=/srv/apps/promeditor

          install -d -m 755 "$app_dir" "$app_dir/scripts" "$app_dir/logs"
          install -m 644 "$release_dir/compose.yaml" "$app_dir/compose.yaml"
          install -m 644 "$release_dir/Dockerfile" "$app_dir/Dockerfile"
          install -m 644 "$release_dir/app.jar" "$app_dir/app.jar"
          install -m 750 "$release_dir/scripts/backup-db.sh" "$app_dir/scripts/backup-db.sh"
          install -m 644 "$release_dir/scripts/promeditor-backup.cron" "$app_dir/scripts/promeditor-backup.cron"
          install -d -m 755 "$app_dir/nginx"
          install -m 644 "$release_dir/nginx/promeditor.conf" "$app_dir/nginx/promeditor.conf"

          docker compose --project-directory "$app_dir" --env-file "$app_dir/config/.env" -f "$app_dir/compose.yaml" up -d --build --remove-orphans
          rm -rf "$release_dir"

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application startup (${attempt}/30)..."
            sleep 2
          done

          echo "Application did not become ready within 60 seconds."
          docker compose --project-directory "$app_dir" --env-file "$app_dir/config/.env" -f "$app_dir/compose.yaml" logs --tail=100 app
          exit 1
          REMOTE_SCRIPT
