<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('템플릿 편집')}"></head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<main class="container">
    <div class="page-header">
        <h1 class="page-title" id="page-title">새 템플릿</h1>
        <div>
            <button id="btn-save" class="btn btn-primary">저장</button>
            <button id="btn-clone" class="btn btn-secondary" style="display:none;">복제</button>
            <button id="btn-delete" class="btn btn-danger" style="display:none;">삭제</button>
            <a th:href="@{/templates}" class="btn btn-secondary">목록으로</a>
        </div>
    </div>

    <!-- 기본 정보 -->
    <div class="card mb-4">
        <div class="form-group">
            <label class="form-label" for="title">템플릿 제목 <span style="color:#ef4444">*</span></label>
            <input type="text" id="title" class="form-control" placeholder="예: 코드 리뷰 요청" maxlength="100">
        </div>
        <div class="form-group">
            <label class="form-label" for="description">설명 (선택)</label>
            <input type="text" id="description" class="form-control" placeholder="이 템플릿이 어떤 상황에 쓰이는지 간단히 적어주세요">
        </div>
        <div style="display:flex;gap:16px;">
            <div class="form-group" style="flex:1">
                <label class="form-label" for="category">카테고리 (선택)</label>
                <input type="text" id="category" class="form-control" placeholder="예: 개발, 글쓰기, 디자인">
            </div>
            <div class="form-group" style="flex:2">
                <label class="form-label" for="tags">태그 (선택, 쉼표로 구분)</label>
                <input type="text" id="tags" class="form-control" placeholder="예: 코드리뷰, PR, 리팩토링">
            </div>
        </div>
    </div>

    <!-- 블록 편집기 -->
    <div class="editor-section">
        <div class="editor-header">
            <h2 class="editor-title">블록 구성</h2>
            <div class="editor-actions">
                <button class="btn btn-secondary" onclick="addFixedBlock()">+ 고정 텍스트</button>
                <button class="btn btn-secondary" onclick="addSlotBlock()">+ 변수 슬롯</button>
            </div>
        </div>
        <div id="block-list" class="block-list">
            <div class="empty-state">
                <p>블록을 추가해보세요.<br>고정 텍스트와 변수 슬롯을 조합하여 템플릿을 만듭니다.</p>
            </div>
        </div>
    </div>

    <!-- 미리보기 -->
    <div class="card mt-8">
        <h2 class="editor-title">미리보기</h2>
        <pre id="preview" class="preview-box">블록을 추가하면 여기에 미리보기가 표시됩니다.</pre>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<!-- 블록 템플릿 (JS에서 복제 사용) -->
<template id="tpl-fixed-block">
    <div class="block-item block-fixed" data-type="FIXED">
        <div class="block-handle">⠿</div>
        <div class="block-body">
            <div class="block-badge">고정 텍스트</div>
            <textarea class="form-control block-content" rows="3" placeholder="고정 텍스트를 입력하세요"></textarea>
        </div>
        <button class="block-remove" onclick="removeBlock(this)">✕</button>
    </div>
</template>

<template id="tpl-slot-block">
    <div class="block-item block-slot" data-type="SLOT">
        <div class="block-handle">⠿</div>
        <div class="block-body">
            <div class="block-badge badge-slot">변수 슬롯</div>
            <div class="slot-row">
                <div class="form-group" style="flex:1">
                    <label class="form-label">슬롯 이름</label>
                    <input type="text" class="form-control slot-name" placeholder="예: 언어, 회사명">
                </div>
                <div class="form-group" style="flex:1">
                    <label class="form-label">입력 타입</label>
                    <select class="form-control slot-type" onchange="onSlotTypeChange(this)">
                        <option value="TEXT">텍스트 (한 줄)</option>
                        <option value="TEXTAREA">텍스트 (여러 줄)</option>
                        <option value="SELECT">드롭다운 선택</option>
                    </select>
                </div>
            </div>
            <div class="select-options" style="display:none;">
                <label class="form-label">선택지 목록</label>
                <div class="option-list"></div>
                <button class="btn btn-secondary mt-4" onclick="addOption(this)" style="font-size:13px;">+ 선택지 추가</button>
            </div>
        </div>
        <button class="block-remove" onclick="removeBlock(this)">✕</button>
    </div>
</template>

<template id="tpl-option-row">
    <div class="option-row">
        <input type="text" class="form-control option-label" placeholder="선택지 텍스트">
        <button class="btn btn-danger" onclick="removeOption(this)" style="padding:8px 12px;">✕</button>
    </div>
</template>

<script th:src="@{/js/template-edit.js}"></script>
</body>
</html>
